services:
  database:
    build: ./database
    container_name: banco-materna
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p12345678 --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - materna-net

  backend:
    build: ./backend
    container_name: backend-materna
    ports:
      - "9090:9090"
    environment:
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - materna-net

  frontend:
    build: ./frontend
    container_name: frontend-materna
    ports:
      - "80:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - materna-net
  
  envio-email:
    build: ./service/envio-email
    container_name: envio-email-materna
    restart: unless-stopped
    env_file:
      - ./service/envio-email/.env
    environment:
      BANCO_HOST: database      # nome do serviço na rede interna
      BANCO_PORTA: "3306"       # porta interna (não a 3307 do host)
      BANCO_USUARIO: root
      BANCO_SENHA: "12345678"
      BANCO_NOME: db_tech_bridge_materna
    depends_on:
      database:
        condition: service_healthy
    networks:
      - materna-net



volumes:
  mysql_data:

networks:
  materna-net:
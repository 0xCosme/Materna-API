              - id_doadora
              - id_etapa
              - id_instituicao
              - id_jornada
              properties:
                id_doadora:
                  type: integer
                  example: 1
                id_etapa:
                  type: integer
                  example: 1
                id_instituicao:
                  type: integer
                  example: 1
                id_jornada:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Vínculo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_doadora:
                    type: integer
                    example: 1
                  id_etapa:
                    type: integer
                    example: 1
                  id_instituicao:
                    type: integer
                    example: 1
                  id_jornada:
                    type: integer
                    example: 1
                  id:
                    type: integer
                    description: ID gerado para o vínculo da jornada de doação

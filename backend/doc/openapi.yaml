        description: ID da jornada
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Dados para atualizar uma jornada
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jornada'
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Jornada not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server (Controller / Model)
    patch:
      tags:
      - Jornada
      summary: Atualiza o status de uma jornada
      description: Ativa ou desativa uma jornada pelo ID
      parameters:
      - name: id
        in: path
        description: ID da jornada
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Novo status da jornada
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - is_ativo
              properties:
                is_ativo:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Jornada atualizada com sucesso
        '400':
          description: Invalid ID or status supplied
        '404':
          description: Jornada not found
        '415':
          description: Invalid Content-Type

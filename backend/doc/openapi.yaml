  /v1/materna/agendamento/{id}:
    put:
      tags:
      - Agendamento
      summary: Atualiza o status de um agendamento
      description: "Aceitar (2) ou recusar (3) só é permitido para agendamentos pendentes. Ao aceitar, o horário fica indisponível; ao recusar, permanece disponível. O registro recusado continua no histórico e não pode ser aceito depois; para usar o horário novamente, crie outro pela rota POST /v1/materna/agendamento. A doadora proprietária pode cancelar (4) um agendamento pendente ou aceito; se aceito, o horário volta a ficar disponível."
      parameters:
      - name: id
        in: path
        description: ID do agendamento
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Novo status do agendamento
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
              - type: object
                required:
                - id_status_agendamento
                properties:
                  id_status_agendamento:
                    type: integer
                    enum: [2, 3]
                    description: 2 para aceitar ou 3 para recusar um agendamento pendente
              - type: object
                required:
                - id_status_agendamento
                - id_doadora
                properties:
                  id_status_agendamento:
                    type: integer
                    enum: [4]
                    description: 4 para cancelar um agendamento próprio pendente ou aceito
                  id_doadora:
                    type: integer
                    minimum: 1
                    description: ID da doadora proprietária do agendamento
                    example: 1
            examples:
              aceitar:
                summary: Aceitar um agendamento pendente
                value:
                  id_status_agendamento: 2
              recusar:
                summary: Recusar um agendamento pendente
                value:
                  id_status_agendamento: 3
              cancelar:
                summary: Cancelar um agendamento próprio
                value:
                  id_status_agendamento: 4
                  id_doadora: 1
      responses:
        '200':
          description: Status do agendamento atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Item atualizado com sucesso!
                  response:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 10
                      id_status_agendamento:
                        type: integer
                        enum: [2, 3, 4]
                        example: 2
                      id_doadora:
                        type: integer
                        description: Retornado quando o status é Cancelado
                        example: 1
        '400':
          description: ID ou status inválido, transição não permitida ou id_doadora inválido para cancelamento
        '404':
          description: Agendamento não encontrado
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server (Controller / Model)

openapi: 3.0.3
info:
  title: Materna
  description: API REST do projeto Materna para gerenciamento de doações de leite
    materno, desenvolvida como parte do TCC
  termsOfService: http://swagger.io/terms/
  contact:
    email: brunohaddadalves75@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.4.26
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: http://localhost:9090
security:
- bearerAuth: []
paths:
  /v1/materna/doadora:
    post:
      tags:
      - Doadora
      summary: Adiciona uma nova doadora
      description: Endpoint para enviar os dados de uma doadora a ser cadastrada
      security: []
      requestBody:
        description: JSON contendo os dados de uma doadora
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Doadora'
      responses:
        '201':
          description: Doadora cadastrada com sucesso
        '400':
          description: Invalid input
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server (Controller / Model)
    get:
      tags:
      - Doadora
      summary: Lista todas as doadoras
      description: Listagem de todas as doadoras registradas no sistema
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doadora'
        '404':
          description: Not Found
        '500':
          description: Error Internal Server (Controller / Model)
  /v1/materna/jornada/doadora/me:
    get:
      tags:
      - Jornada
      summary: Lista as jornadas da doadora autenticada
      responses:
        '200':
          description: Successful operation
        '401':
          description: Token ausente ou inválido
  /v1/materna/jornada/instituicao/me:
    get:
      tags:
      - Jornada
      summary: Lista as jornadas da instituição autenticada
      responses:
        '200':
          description: Successful operation
        '401':
          description: Token ausente ou inválido
  /v1/materna/doadora/login:
    post:
      tags:
      - Doadora
      summary: Autentica uma doadora
      description: Retorna um token JWT para a doadora.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - senha
              properties:
                email:
                  type: string
                  format: email
                  example: maria@email.com
                senha:
                  type: string
                  format: password
                  example: '123456'
      responses:
        '200':
          description: Login realizado com sucesso
        '401':
          description: E-mail ou senha inválidos
        '415':
          description: Invalid Content-Type
  /v1/materna/doadora/me:
    get:
      tags:
      - Doadora
      summary: Busca a doadora autenticada
      description: Retorna os dados da doadora identificada pelo token JWT.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doadora'
        '401':
          description: Token ausente ou inválido
    patch:
      tags:
      - Doadora
      summary: Atualiza a foto da doadora autenticada
      description: Atualiza a foto usando o ID da doadora presente no token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - foto
              properties:
                foto:
                  type: string
                  maxLength: 255
                  example: https://exemplo.com/foto.jpg
      responses:
        '200':
          description: Foto atualizada com sucesso
        '400':
          description: Foto inválida
        '401':
          description: Token ausente ou inválido
        '415':
          description: Invalid Content-Type
  /v1/materna/doadora/otp/verificar:
    post:
      tags:
      - Doadora
      summary: Valida o código OTP da doadora
      description: Confirma o código enviado para validar o cadastro da doadora.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_doadora
              - codigo
              properties:
                id_doadora:
                  type: integer
                  example: 1
                codigo:
                  type: integer
                  example: 123456
      responses:
        '200':
          description: Conta validada com sucesso
        '400':
          description: Código inválido ou dados inválidos
        '415':
          description: Invalid Content-Type
  /v1/materna/doadora/senha:
    patch:
      tags:
      - Doadora
      summary: Atualiza a senha da doadora
      description: Atualiza a senha usando apenas o e-mail da doadora. Esta rota é pública.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - senha
              properties:
                email:
                  type: string
                  format: email
                  example: maria@email.com
                senha:
                  type: string
                  format: password
                  minLength: 6
                  example: '123456'
      responses:
        '200':
          description: Senha atualizada com sucesso
        '400':
          description: E-mail ou senha inválidos
        '404':
          description: Doadora não encontrada
        '415':
          description: Invalid Content-Type
  /v1/materna/doadora/{id}:
    get:
      tags:
      - Doadora
      summary: Busca uma doadora pela ID
      description: Retorna uma doadora pela ID
      parameters:
      - name: id
        in: path
        description: ID da doadora
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doadora'
        '400':
          description: Invalid ID supplied
        '404':
          description: Not Found
        '500':
          description: Error Internal Server (Controller / Model)
    put:
      tags:
      - Doadora
      summary: Atualiza uma doadora pela ID
      description: Buscar e atualizar uma doadora pela ID
      parameters:
      - name: id
        in: path
        description: ID da doadora
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Dados para atualizar uma doadora
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Doadora'
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Doadora not found
        '415':
          description: Invalid Content-Type
        '500':
          description: Error Internal Server (Controller / Model)
    delete:
      tags:
      - Doadora
      summary: Deletar uma doadora existente
      description: Excluir uma doadora
      parameters:
      - name: id
        in: path
        description: ID da doadora
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Doadora not found
        '500':
          description: Error Internal Server (Controller / Model)

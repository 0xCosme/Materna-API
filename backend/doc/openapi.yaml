components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Doadora:
      type: object
      required:
      - nome
      - cpf
      - data_nascimento
      - email
      - senha
      - telefone
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Maria Silva
        cpf:
          type: string
          example: 123.456.789-00
        foto:
          type: string
          example: https://exemplo.com/foto.jpg
        data_nascimento:
          type: string
          format: date
          example: '1995-04-20'
        email:
          type: string
          example: maria@email.com
        senha:
          type: string
          example: maria123
        telefone:
          type: string
          example: '11949491088'
        cep:
          type: string
          example: 92330-036
        estado:
          type: string
          example: SP
        cidade:
          type: string
          example: Itapevi
        endereco:
          type: string
          example: Av.Castelo Branco
        numero:
          type: integer
          example: 11
        complemento:
          type: string
          example: 9A
    Funcionario:
      type: object
      required:
      - nome
      - cpf
      - email
      - senha
      - admin
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Carlos Souza
        cpf:
          type: string
          example: 987.654.321-00
        data_nascimento:
          type: string
          format: date
          example: '1990-01-15'
        email:
          type: string
          example: carlos@email.com
        senha:
          type: string
          example: carlos123
        admin:
          type: boolean
          example: false
        id_instituicao:
          type: integer
          example: 1 
    TipoColeta:
      type: object
      required:
      - tipo
      properties:
        id:
          type: integer
          example: 1
        tipo:
          type: string
          example: Domiciliar
    Instituicao:
      type: object
      required:
      - nome
      - email
      - senha
      - cnpj
      - id_coleta
      - horarios
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Banco de Leite Humano
        foto:
          type: string
          example: https://exemplo.com/logo.jpg
        email:
          type: string
          example: contato@blh.org
        senha:
          type: string
          example: senha123
        cnpj:
          type: string
          example: 12.345.678/0001-90
        id_coleta:
          type: integer
          example: 1
        telefone:
          type: string
          example: 11-99999-9999
        cep:
          type: string
          example: 01310-100
        logradouro:
          type: string
          example: Av.Paulista
        numero:
          type: string
          example: '1000'
        complemento:
          type: string
          example: Bloco B
        bairro:
          type: string
          example: Bela vista
        cidade:
          type: string
          example: São paulo
        uf:
          type: string
          example: SP
        horarios:
          type: array
          description: Dias em que a unidade funciona. Dia que não for enviado é considerado
            fechado.
          items:
            $ref: '#/components/schemas/HorarioFuncionamento'
        funcionario_responsavel:
          type: object
          description: Funcionário responsável pelo cadastro da instituição.
          required:
            - nome
            - cpf
            - data_nascimento
            - email
            - senha
            - admin
          properties:
            nome:
              type: string
              example: Renata Vasconcellos
            cpf:
              type: string
              example: 123.456.789-00
            data_nascimento:
              type: string
              format: date
              example: 1982-08-14
            email:
              type: string
              format: email
              example: renata@blh.org
            senha:
              type: string
              example: Senha@123
            admin:
              type: boolean
              example: true
    HorarioFuncionamento:
      type: object
      required:
      - dia_semana
      - hora_inicio
      - hora_fim
      properties:
        dia_semana:
          type: integer
          minimum: 1
          maximum: 7
          description: ID do dia da semana (1 = Domingo ... 7 = Sábado), obtido em
            GET /dia-semana
          example: 2
        hora_inicio:
          type: string
          description: Horário de abertura em formato 24h
          example: 08:00
        hora_fim:
          type: string
          description: Horário de fechamento em formato 24h
          example: '17:00'
    Campanha:
      type: object
      required:
      - titulo
      - desc
      - data_inicio
      - data_fim
      - is_ativo
      - id_instituicao
      - tbl_funcionario_id
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: Agosto Dourado
        desc:
          type: string
          example: Campanha de incentivo à doação de leite materno
        foto:
          type: string
          example: https://exemplo.com/campanha.jpg
